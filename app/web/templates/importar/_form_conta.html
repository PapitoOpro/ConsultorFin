<form method="post" action="/importar/conta" class="bloco">
  <h2>Cadastrar conta ou cartão</h2>
  {% if token %}<input type="hidden" name="token" value="{{ token }}">{% endif %}
  <div class="grade">
    <div class="campo"><label for="nome">Nome</label>
      <input id="nome" name="nome" required maxlength="80" placeholder="Itaú conta corrente"></div>
    <div class="campo"><label for="tipo">Tipo</label>
      <select id="tipo" name="tipo">{% for k, v in tipos.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <div class="campo"><label for="final_numero">Final da conta (opcional)</label>
      <input id="final_numero" name="final_numero" maxlength="20" placeholder="00000-0"></div>
    <div class="campo"><label for="saldo_inicial">Saldo inicial</label>
      <input id="saldo_inicial" name="saldo_inicial" class="valor" required
             value="{% if sugestao %}{{ sugestao[1] | brl }}{% else %}R$ 0,00{% endif %}"></div>
    <div class="campo"><label for="data_saldo_inicial">Data do saldo inicial</label>
      <input id="data_saldo_inicial" name="data_saldo_inicial" type="date" required
             value="{% if sugestao %}{{ sugestao[0] }}{% endif %}"></div>
  </div>
  {% if sugestao %}<p class="secundario">Sugestão baseada no saldo anterior do arquivo ({{ sugestao[0] | data_br }}).</p>{% endif %}
  <button type="submit">Cadastrar conta</button>
</form>
