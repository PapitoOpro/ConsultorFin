<select name="categoria_id" aria-label="Categoria" hx-post="/lancamentos/{{ l.id }}/categoria" hx-trigger="change" hx-target="closest td" hx-swap="innerHTML">
  <option value=""{{ " selected" if l.categoria_id is none }}>Sem categoria</option>
  {% for cid, nome in categorias %}<option value="{{ cid }}"{{ " selected" if l.categoria_id == cid }}>{{ nome }}</option>{% endfor %}
</select>
