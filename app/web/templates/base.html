<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ConsultorFin{% endblock %} · ConsultorFin</title>
  <link rel="stylesheet" href="/static/css/tema.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/categoria-busca.js" defer></script>
  {% block cabecalho %}{% endblock %}
</head>
<body>
  <div class="layout">
    <nav class="menu" aria-label="Menu principal">
      <div class="marca">ConsultorFin</div>
      <a href="/" class="{{ 'ativo' if ativo == 'inicio' }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Início</span></a>
      <a href="/lancamentos" class="{{ 'ativo' if ativo == 'lancamentos' }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Lançamentos</span></a>
      <a href="/importar" class="{{ 'ativo' if ativo == 'importar' }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        <span>Importar</span></a>
      <a href="/contas-a-pagar" class="{{ 'ativo' if ativo == 'contas' }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Contas a pagar</span></a>
      <a href="/categorias" class="{{ 'ativo' if ativo == 'categorias' }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
        <span>Categorias</span></a>
    </nav>
    <main class="conteudo">
      <div id="mensagens" class="mensagens" role="alert" aria-live="polite">
        {% block mensagens %}{% endblock %}
      </div>
      {% block conteudo %}{% endblock %}
    </main>
  </div>
  <script>
    document.body.addEventListener("htmx:responseError", function (e) {
      var alvo = document.getElementById("mensagens");
      var p = document.createElement("div");
      p.className = "alerta";
      p.textContent = "Erro ao processar a solicitação (" + e.detail.xhr.status + ").";
      alvo.appendChild(p);
    });
  </script>
</body>
</html>
